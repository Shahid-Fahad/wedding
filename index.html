<script>
  (function () {
    var target = Date.parse("2026-11-20T21:00:00+06:00");
    var els = ["d", "h", "m", "s"].map(function (id) { return document.getElementById(id); });
    function pad(n) { return n < 10 ? "0" + n : String(n); }
    function tick() {
      var left = Math.max(0, Math.floor((target - Date.now()) / 1000));
      var v = [Math.floor(left / 86400), Math.floor(left % 86400 / 3600), Math.floor(left % 3600 / 60), left % 60];
      for (var i = 0; i < 4; i++) { var t = pad(v[i]); if (els[i].textContent !== t) els[i].textContent = t; }
      if (left > 0) setTimeout(tick, 1000 - (Date.now() % 1000) + 5);
    }
    tick();
  })();

<style>
  :root { color-scheme: only dark; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #2a0104; }
  canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100dvh; display: block; touch-action: manipulation; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

<body>
  <canvas id="c" role="img" aria-label="Wedding invitation: Shahiduzzaman Fahad and Tasfiya Nazneen Sanam, 20th November 2026, Zinnurain Convention Center, Level 3, East Nasirabad, 2no Gate, Chattogram"></canvas>
  <p class="sr" id="live" aria-live="off"></p>
  <noscript><img src="invitation.jpg" alt="Wedding invitation" style="display:block;max-width:100%;height:auto;margin:auto"></noscript>
<script>
  (function () {
    // Everything is drawn as canvas pixels, so browser dark modes and themes cannot recolor it.
    var W = 1086, H = 1448;
    var TARGET = Date.parse("2026-11-20T21:00:00+06:00");
    var CENTERS = [265, 452.5, 637.5, 822.5];
    var DIGIT_TOP = 807, DIGIT_BOTTOM = 852;
    var FONT = '70px InviteDigits, Georgia, serif';
    var canvas = document.getElementById("c"), ctx = canvas.getContext("2d");
    var img = new Image(), imgReady = false, layout = null;

    function pad(n) { return n < 10 ? "0" + n : String(n); }

    function resize() {
      var dpr = Math.min(window.devicePixelRatio || 1, 3);
      var vw = window.innerWidth, vh = window.innerHeight;
      canvas.width = Math.round(vw * dpr); canvas.height = Math.round(vh * dpr);
      var scale = Math.min(vw / W, vh / H, 1);
      layout = { dpr: dpr, vw: vw, vh: vh, s: scale, x: (vw - W * scale) / 2, y: (vh - H * scale) / 2 };
      draw();
    }

    function draw() {
      if (!layout) return;
      var L = layout;
      ctx.setTransform(L.dpr, 0, 0, L.dpr, 0, 0);
      var bg = ctx.createRadialGradient(L.vw / 2, L.vh / 2, 0, L.vw / 2, L.vh / 2, Math.max(L.vw, L.vh) * 0.7);
      bg.addColorStop(0, "#4a0208"); bg.addColorStop(1, "#2a0104");
      ctx.fillStyle = bg; ctx.fillRect(0, 0, L.vw, L.vh);
      if (!imgReady) return;
      ctx.save();
      ctx.shadowColor = "rgba(0,0,0,0.6)"; ctx.shadowBlur = 60 * L.dpr;
      ctx.drawImage(img, L.x, L.y, W * L.s, H * L.s);
      ctx.restore();

      ctx.save();
      ctx.translate(L.x, L.y); ctx.scale(L.s, L.s);
      var left = Math.max(0, Math.floor((TARGET - Date.now()) / 1000));
      var v = [Math.floor(left / 86400), Math.floor(left % 86400 / 3600), Math.floor(left % 3600 / 60), left % 60];
      ctx.font = FONT; ctx.textAlign = "center"; ctx.textBaseline = "alphabetic";
      var grad = ctx.createLinearGradient(0, DIGIT_TOP, 0, DIGIT_BOTTOM);
      grad.addColorStop(0, "#fff1bd"); grad.addColorStop(0.4, "#f6d27c"); grad.addColorStop(0.75, "#d9a03e"); grad.addColorStop(1, "#f1c96b");
      for (var i = 0; i < 4; i++) {
        var t = pad(v[i]);
        ctx.shadowColor = "rgba(0,0,0,0.55)"; ctx.shadowOffsetY = 1.6 * L.s * L.dpr; ctx.shadowBlur = 2.7 * L.s * L.dpr;
        ctx.fillStyle = grad;
        ctx.fillText(t, CENTERS[i], DIGIT_BOTTOM);
      }
      ctx.restore();
      document.getElementById("live").textContent = v[0] + " days " + v[1] + " hours " + v[2] + " minutes " + v[3] + " seconds left";
    }

    function tick() {
      draw();
      if (Date.now() < TARGET) setTimeout(tick, 1000 - (Date.now() % 1000) + 5);
    }

    window.addEventListener("resize", resize);
    window.addEventListener("orientationchange", resize);
    img.onload = function () { imgReady = true; draw(); };
    img.src = "invitation.jpg?v=10";
    resize();
    var fontReady = Promise.resolve();
    if (window.FontFace && document.fonts) {
      fontReady = new FontFace("InviteDigits", "url(digits.woff2)").load()
        .then(function (f) { document.fonts.add(f); }, function () {});
    }
    Promise.race([fontReady, new Promise(function (r) { setTimeout(r, 3000); })]).then(function () { draw(); tick(); });
  })();
</script>
